name: contract
on:
  push:
    branches: [main]
  pull_request:

jobs:
  topos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: every school in schools/ must hold the contract
        run: |
          for f in schools/*.yaml; do
            echo "── validate $f"
            node manifold/cli.mjs validate "$f"
          done
      - name: the contract must refuse lies (fixtures)
        run: node --test tests/
      - name: render must produce pages, not promises
        run: |
          node manifold/cli.mjs render schools/lotus.yaml
          test -f build/lotus/index.html
          test -f build/lotus/desk/index.html
          grep -q "generated by manifold" build/lotus/index.html
